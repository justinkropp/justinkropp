<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Justin Kropp &mdash; Misanthrope</title>
        <link href="main.css" rel="stylesheet" />
    </head>
    <body>
        <div class="wrapper">
            <section>
                <article><p>Justin Kropp</p></article>
                <article><p>Designer</p></article>
                <article><p>Motorcyclist</p></article>
                <article><p>Musician</p></article>
            </section>
        </div>
        <script>
            // Fade and scramble each corner word in, one after another
            // (skipped for reduced motion)
            const words = document.querySelectorAll(".wrapper article p");
            const reduceMotion = matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;

            const GLYPHS = "abcdefghijklmnopqrstuvwxyz0123456789{}!*^#$&%')";
            const TICK = 33; // ms between scrambles; one character locks per tick
            // ms between each corner starting: top left, top right, bottom left,
            // bottom right (the order of the articles in the markup)
            const STAGGER = 250;
            const randomGlyph = () =>
                GLYPHS[Math.floor(Math.random() * GLYPHS.length)];

            // Cycle random glyphs, locking in the real text left to right
            const scramble = (el) => {
                const text = el.textContent;
                let locked = 0;
                const render = () => {
                    el.textContent = [...text]
                        .map((char, i) =>
                            i < locked || char === " " ? char : randomGlyph()
                        )
                        .join("");
                };
                render();
                const timer = setInterval(() => {
                    locked++;
                    render();
                    if (locked >= text.length) clearInterval(timer);
                }, TICK);
            };

            if (!reduceMotion) {
                // Hide before first paint, then animate once Geist Mono is ready
                words.forEach((el) => {
                    el.setAttribute("aria-label", el.textContent);
                    el.style.opacity = "0";
                });
                document.fonts.ready.then(() => {
                    words.forEach((el, i) => {
                        // fill: backwards keeps it hidden during the delay
                        el.animate([{ opacity: 0 }, { opacity: 1 }], {
                            duration: 300,
                            delay: i * STAGGER,
                            easing: "linear",
                            fill: "backwards",
                        });
                        el.style.opacity = "";
                        setTimeout(() => scramble(el), i * STAGGER);
                    });
                });
            }
        </script>
    </body>
</html>
